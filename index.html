<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help for DamuBPM</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #111821;
      --panel-border: #243041;
      --text: #f4f7fb;
      --muted: #9ba8b8;
      --accent: #4da3ff;
      --accent-hover: #78b9ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(77, 163, 255, 0.12), transparent 32rem),
        var(--bg);
    }

    .card {
      width: min(720px, 100%);
      padding: 48px;
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      background: rgba(17, 24, 33, 0.92);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 6vw, 54px);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    p {
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 17px;
    }

    .links {
      display: flex;
      justify-content: center;
    }

    .link-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      padding: 14px 22px;
      border: 1px solid rgba(77, 163, 255, 0.45);
      border-radius: 12px;
      background: rgba(77, 163, 255, 0.12);
      color: var(--accent);
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .link-button:hover {
      transform: translateY(-1px);
      background: rgba(77, 163, 255, 0.2);
      border-color: var(--accent-hover);
      color: var(--accent-hover);
    }

    .link-button:focus-visible {
      outline: 3px solid rgba(77, 163, 255, 0.35);
      outline-offset: 4px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 34px 22px;
      }

      .link-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Help for DamuBPM</h1>
    <p>Справочная документация и API DamuBPM.</p>

    <div class="links">
      <a class="link-button" href="lua_api.html">Lua API</a>
      <a class="link-button" href="lua_api.html">Lua Modules API</a>
    </div>
  </main>
</body>
</html>
